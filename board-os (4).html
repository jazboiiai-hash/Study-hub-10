settings(){const S=st.set;return`<div class="c"><h2>Settings</h2><p><label>Board exam date <input type="date" value="${S.exam}" onchange="st.set.exam=this.value;save()"></label></p><p><label>Study start date <input type="date" value="${S.start}" onchange="st.set.start=this.value;save()"></label></p><p><label>Daily study hours <input type="number" min="1" max="10" value="${S.target}" onchange="st.set.target=+this.value;save()"></label> <label>Chapters/week <input type="number" min="1" max="10" value="${S.goal}" onchange="st.set.goal=+this.value;save()"></label></p><p>Aakash days: ${DAYS.map(d=>`<label><input type="checkbox" ${S.aakash.includes(d)?'checked':''} onchange="aak('${d}',this.checked)"> ${d}</label> `).join('')}</p><p><label><input type="checkbox" ${S.fx?'checked':''} onchange="st.set.fx=+this.checked;save();particles()"> Floating particles</label> <button onclick="st.set.theme=st.set.theme=='dark'?'light':'dark';save();theme()">Dark / light</button></p><p><button onclick="if(confirm('Erase all progress?')){localStorage.removeItem('bos');location.reload()}">Reset all data</button></p></div>`}};

function particles(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;cancelAnimationFrame(particles.r);x.clearRect(0,0,c.width,c.height);if(!st.set.fx||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const P=Array.from({length:45},()=>({x:Math.random()*c.width,y:Math.random()*c.height,v:.2+Math.random()*.4,r:1+Math.random()*1.5}));
(function f(){x.clearRect(0,0,c.width,c.height);x.fillStyle='rgba(120,170,255,.45)';P.forEach(p=>{p.y-=p.v;if(p.y<0)p.y=c.height;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});particles.r=requestAnimationFrame(f)})()}
